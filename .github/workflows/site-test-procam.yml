name: PROCAM probe
on:
  push:
    branches: ['site-test/procam-full-1123']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/probe_procam.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procam
          path: out/

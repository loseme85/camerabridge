name: UNIT probe
on:
  push:
    branches: ['site-test/unit-20261119']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: BASE=https://unit-filmcamera.com python scripts/shop_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: unit
          path: out/

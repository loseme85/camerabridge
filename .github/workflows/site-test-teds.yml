name: Teds probe
on:
  push:
    branches: ['site-test/teds-20261119']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/teds_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: teds
          path: out/

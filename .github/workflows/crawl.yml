name: Camera Bridge Auto Crawl

on:
  schedule:
    # 09:17 ~ 23:17 KST 2시간마다 (하루 8번). 정각은 GitHub 예약이 몇 시간씩 밀려서 17분에.
    - cron: '17 0-14/2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '판매완료 기록까지 전체 다시 읽기 (평소엔 하루 1번 자동)'
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler
        run: python3 app/test.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWL_FULL: ${{ inputs.full && '1' || '0' }}

      - name: Keep snapshot (Actions storage, not the repo)
        uses: actions/upload-artifact@v4
        with:
          name: crawl-snapshot-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Update exchange rates
        run: python3 scripts/update_fx_rates.py

      - name: Rebuild resolved outputs and search index
        run: python3 final_resolution_pipeline.py

      - name: Link listings to model entities
        run: python3 scripts/build_entity_index.py

      - name: Commit and push results
        run: |
          git config user.name "Camera Bridge Bot"
          git config user.email "bot@camerabridge.app"
          git add -A data/ crawler/sessions/
          git diff --staged --quiet && echo "No changes" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add -A data/ crawler/sessions/
          git commit -m "🤖 Auto crawl $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        if: success()
        run: |
          # 새 매물이 있거나 사이트에 문제가 있을 때만 알림 (하루 8번 실행이라 매번 보내면 너무 많음)
          MSG=$(python3 - <<'EOF'
          import json
          s = json.load(open("crawler/sessions/crawl_sessions.json"))[-1]
          bad = [f"⚠️ {x['site']}: {x['status']} ({x.get('reason','')})" for x in s.get("sources", []) if x.get("status") != "ok"]
          if s.get("new_items") or bad:
              lines = [f"✅ 크롤링 완료 · 신규 {s.get('new_items', 0)} · 총 {s.get('total_items')}개 · {s.get('seconds')}초"]
              lines += [f"🆕 {n['상품명'][:40]} ({n['site']})" for n in s.get("new_listings", [])[:10]]
              lines += bad
              print("\n".join(lines))
          EOF
          )
          [ -z "$MSG" ] && echo "알릴 것 없음" && exit 0
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

      - name: Notify failure
        if: failure()
        run: |
          KST=$(date '+%Y-%m-%d %H:%M' -d '+9 hours')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ 크롤링 실패!%0A📅 ${KST} KST%0A🔗 https://github.com/loseme85/camerabridge/actions"

name: Camera Bridge Auto Crawl

on:
  schedule:
    # 09:17 ~ 23:17 KST 1시간마다 예약하고, 마지막 크롤링 뒤 100분이 안 지났으면 건너뜀 (아래 guard).
    # 2시간마다(하루 8번)로 두었더니 GitHub이 예약을 밀거나 빠뜨려 실제로는 하루 2~3번만 돌았음 (2026-10-28~11-05 기록).
    # 예약 칸을 늘려 빠져도 2시간 안팎 간격이 되게 함. 정각은 GitHub 예약이 몇 시간씩 밀려서 17분에.
    - cron: '17 0-14 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '판매완료 기록까지 전체 다시 읽기 (평소엔 하루 1번 자동)'
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write
  statuses: read  # 미리 깨우기: Vercel 배포가 끝났는지 커밋 상태로 확인

jobs:
  guard:
    # 예약 실행일 때만: 마지막 자동 크롤링 커밋이 100분 안이면 이번 회차는 건너뜀 (손으로 돌리면 항상 실행)
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(git log -1 --format=%ct --grep='Auto crawl' origin/main 2>/dev/null || git log -1 --format=%ct --grep='Auto crawl')
          now=$(date +%s)
          age=$(( (now - ${last:-0}) / 60 ))
          echo "마지막 자동 크롤링: ${age}분 전"
          if [ "${last:-0}" -gt 0 ] && [ "$age" -lt 100 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  crawl:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04  # ubuntu-latest가 26.04로 바뀌어 Playwright 1.58 크롬 설치 실패 (2026-10-26)
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler
        run: python3 app/test.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWL_FULL: ${{ inputs.full && '1' || '0' }}
          RELAY_URL: ${{ secrets.RELAY_URL }}   # 해외 접속을 막는 일본 사이트용 Vercel 도쿄 중계 (relay/)
          RELAY_KEY: ${{ secrets.RELAY_KEY }}

      - name: Keep snapshot (Actions storage, not the repo)
        uses: actions/upload-artifact@v4
        with:
          name: crawl-snapshot-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Update exchange rates
        run: python3 scripts/update_fx_rates.py

      - name: Rebuild resolved outputs and search index
        run: python3 final_resolution_pipeline.py

      - name: Link listings to model entities
        run: python3 scripts/build_entity_index.py

      - name: Audit entities (missing-model candidates)
        run: python3 scripts/entity_audit.py

      - name: Record weekly model prices (dealer price trends)
        run: python3 scripts/build_price_history.py

      - name: Build dealer page data (/dealer)
        run: python3 scripts/build_dealer_data.py

      - name: Build model pages and sitemap (검색 노출용)
        run: python3 scripts/build_model_pages.py

      - name: List changed pages for IndexNow (Bing·네이버에 알릴 목록)
        run: python3 scripts/indexnow.py --plan
        continue-on-error: true

      - name: Commit and push results
        run: |
          git config user.name "Camera Bridge Bot"
          git config user.email "bot@camerabridge.app"
          git add -A data/ crawler/sessions/ ko/ en/ ja/ sitemap.xml
          git diff --staged --quiet && echo "No changes" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add -A data/ crawler/sessions/ ko/ en/ ja/ sitemap.xml
          git commit -m "🤖 Auto crawl $(date '+%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tell Bing·Naver about changed pages (IndexNow)
        run: python3 scripts/indexnow.py --send
        continue-on-error: true

      - name: Notify success
        if: success()
        run: |
          # 새 매물이 있거나 사이트에 문제가 있을 때만 알림 (하루 8번 실행이라 매번 보내면 너무 많음)
          MSG=$(python3 - <<'EOF'
          import json
          s = json.load(open("crawler/sessions/crawl_sessions.json"))[-1]
          bad = [f"⚠️ {x['site']}: {x['status']} ({x.get('reason','')})" for x in s.get("sources", []) if x.get("status") != "ok"]
          try:
              audit_new = json.load(open("data/derived/entity_audit.json")).get("new", [])
          except Exception:
              audit_new = []
          bad += [f"🔍 빠진 모델 후보: {x.get('entity') or x.get('a')} ← {x.get('word') or x.get('b')} {x['count']}건 · {x['example'][:40]}" for x in audit_new[:5]]
          if s.get("new_items") or bad:
              lines = [f"✅ 크롤링 완료 · 신규 {s.get('new_items', 0)} · 총 {s.get('total_items')}개 · {s.get('seconds')}초"]
              lines += [f"🆕 {n['상품명'][:40]} ({n['site']})" for n in s.get("new_listings", [])[:10]]
              lines += bad
              print("\n".join(lines))
          EOF
          )
          [ -z "$MSG" ] && echo "알릴 것 없음" && exit 0
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

      - name: Warm up after deploy (배포 직후 첫 검색이 느리지 않게) + 알림 검사
        if: success()
        continue-on-error: true  # 미리 깨우기가 실패해도 크롤링은 성공
        run: |
          SHA=$(git rev-parse HEAD)
          [ "$SHA" = "${{ github.sha }}" ] && echo "새 커밋 없음 → 배포 없음" && exit 0
          for i in $(seq 1 40); do
            STATE=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" -q .state)
            [ "$STATE" = success ] && break
            [ "$STATE" = failure ] || [ "$STATE" = error ] && echo "배포 실패 ($STATE)" && exit 0
            sleep 15
          done
          python3 scripts/warm_up.py https://camerabridge.io
          # 저장 상품·원하는 매물 알림을 크롤링 직후마다 (하루 한 번 cron만 있으면 새 매물 메일이 최대 하루 늦음).
          # 이미 알린 매물은 다시 안 보내서 여러 번 돌려도 같은 메일이 또 가지 않음
          CODE=$(curl -s -o /tmp/alerts.json -w "%{http_code}" -m 120 ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
                 "https://camerabridge.io/api/board?r=alerts")
          echo "🔔 알림 검사: HTTP $CODE $(cat /tmp/alerts.json 2>/dev/null | head -c 200)"
          grep -q '"mail_ready": false' /tmp/alerts.json 2>/dev/null && \
            echo "::warning::메일 키(RESEND_API_KEY)가 Vercel에 없어 알림 메일이 안 나감 — $(grep -o '"members": [0-9]*' /tmp/alerts.json)명이 알림을 켬"
          [ "$CODE" = 401 ] && echo "⚠️ Vercel에 CRON_SECRET이 있으면 GitHub 저장소 비밀값에도 같은 값으로 CRON_SECRET을 넣어야 함"
          true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Notify failure
        if: failure()
        run: |
          KST=$(date '+%Y-%m-%d %H:%M' -d '+9 hours')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ 크롤링 실패!%0A📅 ${KST} KST%0A🔗 https://github.com/loseme85/camerabridge/actions"

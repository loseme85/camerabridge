<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Camera Bridge · Dealer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* 딜러 화면: camerabridge.io 첫 화면과 같은 색·글꼴. 각진 틀과 가는 줄만 쓴다 */
    :root{
      --bg:#ffffff;
      --surface:#ffffff;
      --surface-soft:#f5f6f5;
      --border:#e1e4e3;
      --border-strong:#c9cecc;
      --text:#16181a;
      --text-soft:#5d6266;
      --text-muted:#8a9094;
      --accent:#1f4a3a;
      --accent-soft:rgba(31,74,58,0.08);
      --high:#9b2c22;
      --high-soft:#f8ecea;
      --low:#2e6d43;
      --low-soft:#eaf3ed;
      --amber:#99611f;
      --amber-soft:#f7f0e4;
      --serif:Newsreader,"Noto Serif KR",Georgia,serif;
      --sans:Inter,"Pretendard Variable",Pretendard,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
    a{color:inherit}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer}
    :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    [hidden]{display:none !important}
    .num,td.r{font-variant-numeric:tabular-nums}

    .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--text)}
    .topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--accent);text-decoration:none}
    .brand-logo{display:block;height:44px;width:auto;margin:-6px 0}
    .brand-tag{color:var(--text-soft);font-size:13px;border-left:1px solid var(--border-strong);padding-left:12px}
    .top-meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px}
    .top-meta label{color:var(--text-soft)}
    .top-meta .store-name{font-weight:600}
    select,input[type=text],input[type=number],input[type=password]{background:var(--surface);border:1px solid var(--border-strong);border-radius:0;padding:5px 8px}
    select:hover,input:hover{border-color:var(--text-soft)}
    .asof{color:var(--text-muted);font-size:12px}
    .linkbtn{background:none;border:0;padding:0;color:var(--text-soft);text-decoration:underline;text-underline-offset:2px}
    .linkbtn:hover{color:var(--accent)}
    @media (max-width:560px){.brand-logo{height:36px}.top-meta{margin-left:0;width:100%}}

    .wrap{max-width:1280px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:0 32px}
    nav.toc{position:sticky;top:66px;align-self:start;padding-top:20px}
    nav.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);padding:9px 0}
    nav.toc button .n{color:var(--text-muted);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}
    nav.toc button[aria-current="true"]{font-weight:600;border-bottom-color:var(--text)}
    nav.toc button:hover{color:var(--accent)}
    main{min-width:0;padding-top:20px}
    @media (max-width:760px){
      .wrap{grid-template-columns:minmax(0,1fr)}
      nav.toc{position:static;display:flex;overflow-x:auto;gap:16px;padding-top:6px;border-bottom:1px solid var(--border)}
      nav.toc button{width:auto;white-space:nowrap;border:0;padding:8px 0}
      nav.toc button[aria-current="true"]{border-bottom:2px solid var(--text)}
    }

    h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
    h2{font-size:15px;font-weight:700;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--text);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
    h2 small{font-weight:400;color:var(--text-muted);font-size:12px}
    .lede{color:var(--text-soft);max-width:72ch;margin:0 0 8px}

    .figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--text);border-bottom:1px solid var(--border);margin-top:16px}
    .figs > div{padding:12px 14px 12px 0;border-right:1px solid var(--border);min-width:0}
    .figs > div + div{padding-left:14px}
    .figs > div:last-child{border-right:0}
    .figs .v{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
    .figs .l{color:var(--text-soft);font-size:13px}
    .figs button{background:none;border:0;padding:0;color:var(--accent);font-size:13px}
    .figs button:hover{text-decoration:underline}
    @media (max-width:760px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.figs > div:nth-child(2){border-right:0}.figs > div:nth-child(3){padding-left:0}.figs > div:nth-child(n+3){border-top:1px solid var(--border)}}

    .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
    @media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

    .tbl{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-weight:500;color:var(--text-soft);font-size:12px;border-bottom:1px solid var(--border);padding:6px 8px 6px 0;white-space:nowrap}
    td{border-bottom:1px solid var(--border);padding:7px 8px 7px 0;vertical-align:top}
    td.r,th.r{text-align:right}
    td.r{white-space:nowrap}
    tr.click{cursor:pointer}
    tr.click:hover td{background:var(--surface-soft)}
    .t{max-width:46ch}
    .t a{text-decoration:none}
    .t a:hover{color:var(--accent);text-decoration:underline}
    .sub{color:var(--text-soft);font-size:12px}

    .mark{display:inline-block;padding:0 5px;font-size:12px;font-weight:500;border:1px solid currentColor;white-space:nowrap}
    .mark.high{color:var(--high);background:var(--high-soft)}
    .mark.low{color:var(--low);background:var(--low-soft)}
    .mark.ok{color:var(--text-soft)}
    .mark.warn{color:var(--amber);background:var(--amber-soft)}
    .mark.acc{color:var(--accent);background:var(--accent-soft)}

    .bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:8px 0 4px}
    .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--text)}
    .seg button{background:var(--surface);border:0;border-right:1px solid var(--text);padding:4px 10px}
    .seg button:last-child{border-right:0}
    .seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
    .chk{display:inline-flex;gap:6px;align-items:center;color:var(--text-soft)}

    .search{position:relative;max-width:540px}
    .search input{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--text)}
    .sugg{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--text);border-top:0;z-index:5;max-height:320px;overflow-y:auto}
    .sugg button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);padding:7px 10px}
    .sugg button:hover,.sugg button.on{background:var(--surface-soft)}

    .model-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline;margin-top:18px}
    .model-head h1{font-size:28px}
    .ref{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--text);margin-top:10px}
    .ref > div{padding:8px 10px;border-right:1px solid var(--border)}
    .ref > div:last-child{border-right:0}
    .ref .g{font-weight:700}
    .ref .g span{color:var(--text-soft);font-weight:400;font-size:12px;margin-left:4px}
    .ref .p{font-family:var(--serif);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
    .ref .est .p{color:var(--text-muted);font-weight:500}
    @media (max-width:640px){.ref{grid-template-columns:repeat(3,minmax(0,1fr))}.ref > div:nth-child(3){border-right:0}.ref > div:nth-child(n+4){border-top:1px solid var(--border)}}

    .calc{border:1px solid var(--text);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px;margin-top:10px}
    @media (max-width:760px){.calc{grid-template-columns:minmax(0,1fr)}}
    .fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
    .fields label{color:var(--text-soft)}
    .fields input,.fields select{width:100%;max-width:220px}
    .calc .out{border-left:1px solid var(--border);padding-left:24px}
    @media (max-width:760px){.calc .out{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:12px}}
    .calc .big{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
    .calc .lines{font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
    .calc .lines div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--border-strong);padding:2px 0}

    .note{color:var(--text-soft);font-size:12.5px;max-width:84ch;margin:10px 0 0}
    .basis{border-left:3px solid var(--amber);padding:4px 10px;background:var(--amber-soft);color:var(--text);font-size:13px;margin:8px 0 0;max-width:84ch}
    .empty{color:var(--text-soft);padding:14px 0}
    .more{margin-top:8px;background:none;border:1px solid var(--text);padding:5px 12px}
    .more:hover{background:var(--surface-soft)}
    .loading{padding:60px 16px;text-align:center;color:var(--text-soft)}
    .form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;max-width:520px;margin-top:10px}
    .form label{color:var(--text-soft)}
    .form input{width:100%;max-width:280px}
    .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:6px 16px}
    .msg{margin:10px 0 0;font-size:13px}
    .msg.bad{color:var(--high)}
    .msg.good{color:var(--low)}
    footer{max-width:1280px;margin:0 auto;padding:16px 16px 32px;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border)}
  </style>
</head>

const fromInput = n => {

const inputUnit = () => myCurrency() === "KRW" && state.lang === "ko" ? "만원" : myCurrency();

const daysSince = s => s ? Math.max(0, Math.floor((NOW - new Date(s.replace(" ", "T") + ":00+09:00")) / 864e5)) : null;

function askIndex() {

    if (!it.e || !it.g || it.g === "X" || isMine(it.s) || !sameCountry(it.s)) continue;

// 신품(N)은 나라마다 정가·세금이 달라 중고 기준가 × 비율로 내지 않고, 그 나라 신품 매물 가격을 쓴다

// ── 예상 총액 (camerabridge.io 첫 화면 computeLandedCost 를 원화 기준으로 옮김) ──
const krwPer = c => D.fx.rates[c];

}
function taxUsd(destRule, ctx) {
  const dutyKey = ctx.category === "Body" && ctx.digital ? "Body_digital" : ctx.category;

function searchEntities(q) {
  const norm = s => String(s).toLowerCase().replace(/[\s\-_.\/]+/g, "").replace(/mm/g, "").replace(/f(?=\d)/g, "");
  const nq = norm(q);
  if (!nq) return [];
  const hits = [];
  for (const [id, e] of Object.entries(D.entities)) {
    const keys = [e.n, e.ko, ...(e.al || [])].filter(Boolean).map(norm);
    let best = -1;
    for (const k of keys) {
      if (k === nq) best = Math.max(best, 3);
      else if (k.startsWith(nq)) best = Math.max(best, 2);
      else if (k.includes(nq)) best = Math.max(best, 1);
    }
    const act = D.active.length && (CACHE.actN || (CACHE.actN = D.active.reduce((m, it) => (it.e && (m[it.e] = (m[it.e] || 0) + 1), m), {})))[id] || 0;
    if (best >= 0) hits.push({ id, e, act, score: best * 1000 + (((e.sb || {}).ALL || [0, 0])[1]) + act });
  }
  return hits.sort((a, b) => b.score - a.score).slice(0, 10);
}
function bindSearch() {
  const q = $("#q"), sg = $("#sugg");
  let hits = [], on = 0;
  const draw = () => {
    sg.hidden = !hits.length;
    sg.innerHTML = hits.map((h, i) => `<button type="button" class="${i === on ? "on" : ""}" data-pick="${esc(h.id)}"><span>${esc(entName(h.id))} ${state.lang === "ko" && h.e.ko ? `<span class="sub">${esc(h.e.n)}</span>` : ""}</span><span class="sub num">${h.act}</span></button>`).join("");
  };
  q.addEventListener("input", () => { hits = searchEntities(q.value); on = 0; draw(); });
  q.addEventListener("keydown", ev => {
    if (!hits.length) return;
    if (ev.key === "ArrowDown") { on = (on + 1) % hits.length; draw(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { on = (on - 1 + hits.length) % hits.length; draw(); ev.preventDefault(); }
    if (ev.key === "Enter") { pick(hits[on].id); ev.preventDefault(); }
    if (ev.key === "Escape") { hits = []; draw(); }
  });
  if (!state.entity) q.focus();
}
function pick(id) {
  state.entity = id; state.calcSale = null; state.calcG = "B";
  keep.set("entity", id);
  render();
}
function bindCalc() {
  const ids = { cg: "calcG", cs: "calcSale", cm: "calcMargin", cr: "calcRepair" };
  for (const [el, key] of Object.entries(ids)) {
    const node = document.getElementById(el);
    if (!node) continue;
    node.addEventListener("change", () => {
      if (key === "calcG") { state.calcG = node.value; state.calcSale = null; }
      else state[key] = node.value === "" ? 0 : +node.value;
      const y = window.scrollY; render(); window.scrollTo({ top: y });
    });
  }
}
function bindPassword() {
  $("#pwform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = $("#pwmsg");
    const show = (key, good) => { msg.textContent = t(key); msg.className = "msg " + (good ? "good" : "bad"); };
    if ($("#pwn").value.length < 10) return show("pw_short");
    try {
      const res = await fetch("/dealer/password", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ current: $("#pwc").value, new: $("#pwn").value }) });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.ok) { $("#pwform").reset(); return show("pw_ok", true); }
      show(body.error === "wrong" ? "pw_wrong" : body.error === "short" ? "pw_short" : "pw_err");
    } catch { show("pw_err"); }
  });
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("button, a, tr.click");
  if (!el) return;
  if (el.matches("#toc button")) return go(el.dataset.v);
  if (el.dataset.pick) { ev.preventDefault(); state.view = "buy"; keep.set("view", "buy"); return pick(el.dataset.pick); }
  if (el.dataset.go) {
    const o = {};
    if (el.dataset.sf) o.stockFilter = el.dataset.sf;
    if (el.dataset.local) { o.feedLocal = true; o.feedType = "all"; }
    return go(el.dataset.go, o);
  }
  if (el.dataset.more) { state.lim[el.dataset.more] = lim(el.dataset.more, +el.dataset.step) + +el.dataset.step; const y = window.scrollY; render(); window.scrollTo({ top: y }); return; }
  if (el.dataset.sf) { state.stockFilter = el.dataset.sf; state.lim.stock = 0; return render(); }
  if (el.dataset.ft) { state.feedType = el.dataset.ft; state.lim.feed = 0; return render(); }
  if (el.dataset.sk) { state.srcKind = el.dataset.sk; state.lim.src = 0; return render(); }
  if (el.matches("tr.click") && !ev.target.closest("a") && el.dataset.entity) { state.view = "buy"; pick(el.dataset.entity); window.scrollTo({ top: 0 }); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "flocal") { state.feedLocal = ev.target.checked; render(); }
  if (ev.target.id === "fmine") { state.feedMine = ev.target.checked; render(); }
  if (ev.target.id === "lang") { state.lang = ev.target.value; keep.set("lang", state.lang); render(); }
  if (ev.target.id === "store") { state.store = ev.target.value; state.lim = {}; CACHE = {}; keep.set("store", state.store); render(); }
});

function defaultLang() {
  const saved = keep.get("lang");
  if (saved && LANGS[saved]) return saved;
  if (ME.lang && LANGS[ME.lang]) return ME.lang;
  return COUNTRY_LANG[myCountry()] || "en";
}

Promise.all([
  fetch("/dealer/data", { cache: "no-store" }).then(r => { if (r.status === 401) { location.href = "/dealer/login"; throw new Error("auth"); } return r.json(); }),
  fetch("/data/config/landed_cost_rules.json").then(r => (r.ok ? r.json() : null)).catch(() => null),
]).then(([payload, rules]) => {
  if (!window.ME) { location.href = "/dealer/login"; return; }
  D = payload; ME = window.ME; RULES = rules;
  NOW = new Date(D.generated.replace(" ", "T") + ":00+09:00");
  if (ME.admin) {
    const saved = keep.get("store");
    state.store = saved && D.sites[saved] ? saved : Object.keys(D.sites).find(s => siteCountry(s) === "KR") || Object.keys(D.sites)[0];
  }
  state.lang = defaultLang();
  const v = keep.get("view");
  state.view = v && V[v] ? v : "brief";
  const se = keep.get("entity");
  state.entity = se && D.entities[se] ? se : (D.entities["leica:lens:summilux-m:35:asph-fle"] ? "leica:lens:summilux-m:35:asph-fle" : null);
  render();
}).catch(err => {
  if (err && err.message === "auth") return;
  $("#main").innerHTML = `<p class="loading">${esc(I.en.load_fail)}</p>`;
});
</script>
